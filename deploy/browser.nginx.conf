# Included inside the vanillacake.cn HTTPS server block.
location ^~ /cakeui-dist/ {
    root /var/www/html;
    if ($uri ~ /\.) { return 404; }
    try_files $uri =404;
    autoindex off;
    add_header Cache-Control no-cache always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}
