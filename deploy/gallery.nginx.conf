# CakeUI gallery — managed by scripts/deploy-gallery.ps1
server {
    listen 80;
    listen [::]:80;
    server_name gallery.vanillacake.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://gallery.vanillacake.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gallery.vanillacake.cn;
    root /var/www/cakeui-gallery/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/gallery.vanillacake.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gallery.vanillacake.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CakeUIGallery:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/cakeui-gallery.access.log;
    error_log /var/log/nginx/cakeui-gallery.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Keep hashed assets from earlier releases available to already open pages.
    location /assets/ {
        root /var/www/cakeui-gallery;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Serve AI references directly; a missing document must never become SPA HTML.
    location ~ ^/llms(?:-[a-z0-9-]+)?\.txt$ {
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
